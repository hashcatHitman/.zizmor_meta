rules:
  adhoc-packages:
    disable: false
  anonymous-definition:
    disable: false
  archived-uses:
    disable: false
  artipacked:
    disable: false
  bot-conditions:
    disable: false
  cache-poisoning:
    disable: false
  concurrency-limits:
    disable: false
  dangerous-triggers:
    disable: false
  dependabot-cooldown:
    disable: false
    config:
      days: 14
  dependabot-execution:
    disable: false
  excessive-permissions:
    disable: false
  forbidden-uses:
    disable: false
  github-app:
    disable: false
  github-env:
    disable: false
  hardcoded-container-credentials:
    disable: false
  impostor-commit:
    disable: false
  insecure-commands:
    disable: false
  insecure-url-scheme:
    disable: false
  known-vulnerable-actions:
    disable: false
  misfeature:
    disable: false
  obfuscation:
    disable: false
  overprovisioned-secrets:
    disable: false
  ref-confusion:
    disable: false
  ref-version-mismatch:
    disable: false
  secrets-inherit:
    disable: false
  secrets-outside-env:
    disable: false
  self-hosted-runner:
    disable: false
  self-repository:
    disable: false
  stale-action-refs:
    disable: false
  superfluous-actions:
    disable: false
  template-injection:
    disable: false
  typosquat-uses:
    disable: false
  undocumented-permissions:
    disable: false
  unpinned-images:
    disable: false
  unpinned-tools:
    disable: false
  unpinned-uses:
    disable: false
    config:
      policies:
        "*": hash-pin
  unredacted-secrets:
    disable: false
  unsound-condition:
    disable: false
  unsound-contains:
    disable: false
  unsound-ternary:
    disable: false
  use-trusted-publishing:
    disable: false
